id: all_u
title: All U
note: Nine levels, three streets, every cell a three-level U entered on its middle level.
parameters: {levels: 9}
steps:
  - {rule: axiom_block}
  - {rule: lift}
  - {rule: stack}
  - {rule: bay, select: "*"}
  - {rule: core, select: {where: "b.bay in (2, 19)"}}
  - {rule: street, select: {where: "b.level in (2, 5, 8)"}}
  - {rule: cell, params: {k: 3, ci: 1}, select: {where: "b0.level in (1, 4, 7) and 3 <= b0.bay <= 18"}}
  - {rule: end_unit, select: "*", repeat: true}
  - {rule: roof, select: "*"}
  - {rule: penthouse, select: {where: "s.bay == 2"}}
  - {rule: facade}
  - {rule: axiom_condenser}
  - {rule: stack_condenser}
  - {rule: merge, select: {where: "a.level == 1"}}
  - {rule: gallery}
  - {rule: facade_condenser}
  - {rule: core_condenser}
  - {rule: bridge, select: {where: "c.level == 2"}}
